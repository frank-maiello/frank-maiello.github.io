<!DOCTYPE html>
<html>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<head>
    <title>R0IDS 1.100</title>
    <style>
        body {font-family: verdana; 
            font-size: 14px;
            color: hsl(0, 0%, 89%);
            text-align: center;
            text-shadow: 3px 4px 10px hsl(0, 0%, 0%);
            margin: 0;
            padding: 0;
            overflow: hidden;

        }
        h1 {font-family: verdana; 
            font-size: 12px;
            color: hsl(0, 0%, 65%);
            text-align: center;
            text-shadow: 3px 4px 10px hsl(0, 0%, 0%);
            margin-left: 0px;
            margin-right: 0px;
            padding-left: 0px;
            padding-right: 0px;
            padding-top: 10px;
            display: inline;
        }
        h2 {font-family: verdana; 
            font-size: 0px;
            color: hsl(0, 0%, 65%);
            float: left;
            text-shadow: 3px 4px 10px hsl(0, 0%, 0%);
            margin-left: 0px;
            margin-right: 0px;
            padding-left: 0px;
            padding-right: 0px;
            display: inline;
        }
        .checkbox:hover {opacity: 1}
        .checkbox {-webkit-appearance: none;
            appearance: none;
            padding: 0px;
            border: 0px;
            vertical-align: middle;
            margin-top: 0px;
            margin-bottom: 0px;
            margin-left: 0px;
            margin-right: 5px;
            width: 15px;
            height: 15px;
            border-radius: 10px;
            background-color: hsl(0, 87%, 44%);
            opacity: 0.7;
            border: 2px solid hsl(0, 0%, 83%);
            cursor: pointer;
            box-shadow: 3px 4px 10px hsl(0, 0%, 0%)}
        .checkbox:checked {
            background-color: hsl(118, 100%, 33%);
        }
        .radio:hover {opacity: 1}
        .radio {-webkit-appearance: none;
            appearance: none;
            padding: 0px;
            border: 0px;
            vertical-align: middle;
            margin-top: 0px;
            margin-bottom: 0px;
            margin-left: 0px;
            margin-right: 5px;
            width: 15px;
            height: 15px;
            border-radius: 10px;
            background-color: hsl(200, 80%, 27%);
            opacity: 0.7;
            border: 2px solid hsl(0, 0%, 83%);
            cursor: pointer;
            box-shadow: 3px 4px 10px hsl(0, 0%, 0%)}
        .radio:checked {
            background-color: hsl(118, 100%, 33%);
        }
        .button:hover {opacity: 1}
        .button {
            appearance: none;
            padding: 0px;
            border: 0px;
            vertical-align: middle;
            margin-top: 0px;
            margin-bottom: 0px;
            margin-left: 0px;
            margin-right: 5px;
            width: 15px;
            height: 15px;
            border-radius: 10px;
            color: black;
            background-color: hsl(0, 80%, 47%);
            opacity: 0.7;
            cursor: pointer;
            box-shadow: 3px 4px 10px hsl(0, 0%, 0%)}
        
        .button1:hover {opacity: 1}
        .button1 {
            appearance: none;
            padding: 0px;
            border: 0px;
            vertical-align: middle;
            margin-top: 0px;
            margin-bottom: 0px;
            margin-left: 0px;
            margin-right: 5px;
            width: 15px;
            height: 15px;
            border-radius: 10px;
            color: black;
            background-color: hsl(30, 80%, 47%);
            opacity: 0.7;
            cursor: pointer;
            box-shadow: 3px 4px 10px hsl(0, 0%, 0%)}
        </style>
</head>

<body style="background: linear-gradient(to bottom, hsl(0, 0%, 8%) 0%, hsl(0, 0%, 15%) 50%); background-attachment: fixed; margin: 0; padding: 0;">
    <div style="display:none;">
        <img id="andromeda" src="andromeda.png">
        <img id="earth" src="planet_disc.png">
    </div>
        <canvas id="myCanvas" style="display: block; margin: 0; padding: 0;">
    </canvas>

    <!-- All controls are now in the in-canvas menu at bottom left -->
    
    <script src="roids.js"></script>
</body>
</html>
